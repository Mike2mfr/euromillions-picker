name: Update EuroMillions draws

on:
  schedule:
    # Wednesday and Saturday mornings (UTC), after the Tuesday and Friday draws
    - cron: "37 6 * * 3,6"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append new draws
        run: python scripts/update_draws.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No new draws."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.csv meta.json
          git commit -m "Add latest EuroMillions draw"
          git push
